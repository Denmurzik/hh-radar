  intent: "комбинированный запрос: voice + RAG + домен проекта (hh-radar) одновременно"
  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)голосов[а-я]* ассистент"
    - "(?i)voice assistant"
