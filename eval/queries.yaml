  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)интеграц.*api"
    - "(?i)api.*интеграц"

- id: q21
  query: "проект для тех, кто раньше писал юнит-тесты, а теперь хочет писать тесты для поведения ИИ"
  intent: "перифраз перехода QA -> LLM evaluation, смешанный запрос про смену специализации"
  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)тестирован.*(модел|llm|ии\\b)"
    - "(?i)qa.*(ai|ии|llm)"

- id: q22
  query: "нет опыта с языковыми моделями, но есть опыт с обычным бэкендом — возьмут?"
  intent: "запрос про перенос навыков (backend -> AI) — проверяем, найдётся ли junior-в-AI позиция"
