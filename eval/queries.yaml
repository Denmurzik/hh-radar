  relevant_patterns:
    - "(?i)backend"
    - "(?i)бэкенд"
    - "(?i)без опыта"

- id: q23
  query: "оплата в валюте, но фактически удалённо на Россию"
  intent: "запрос про условия оплаты и локацию, без единого технического термина"
  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)удал[её]нн?"
    - "(?i)валют"

- id: q24
  query: "нужно сделать так, чтобы агент сам понимал, когда стоит остановиться и спросить человека"
