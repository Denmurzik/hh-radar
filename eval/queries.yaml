# Размеченный набор запросов для оценки ретривала (hh_radar.rag.evaluate).
#
# `relevant_vacancy_ids` заполняется вручную ПОСЛЕ наполнения базы реальными
# вакансиями — до этого поле пустое, оно намеренно, а не забыто.
# `relevant_patterns` — запасной способ разметки на основе regex по названию
# вакансии: он позволяет считать recall/precision/MRR ещё до ручной разметки,
# пусть и грубее (учитывает только совпадение в названии, а не по факту
# релевантности содержимого).
#
# Домен запросов: AI, автоматизация, n8n, MCP, Python-интеграции. Акцент
# сделан на формулировки, которые НЕ ловятся ключевыми словами: перифразы
# задачи вместо названия технологии, описания условий труда, вопросы про
# уровень кандидата — именно на таких запросах разница между полнотекстовым
# и семантическим поиском должна быть видна нагляднее всего.

- id: q01
  query: "вакансии, где надо чинить чужие сломанные автоматизации"
  intent: "перифраз без ключевых слов «поддержка»/«support»: проверяем, ловит ли семантика задачу, а не термин"
  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)поддержк.*(автоматизац|интеграц)"
    - "(?i)сопровожден.*(автоматизац|интеграц)"

- id: q02
  query: "работа с ботами, которые сами договариваются между собой"
  intent: "перифраз «мультиагентные системы» — проверяем перенос из бытового описания в термин"
  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)мультиагент"
    - "(?i)multi-?agent"
    - "(?i)агентн"

- id: q03
  query: "нужен человек, который свяжет CRM и мессенджер через no-code"
  intent: "перифраз задач n8n/Zapier-подобных инструментов без прямого упоминания продукта"
  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)n8n"
    - "(?i)zapier"
    - "(?i)make\\.com"
    - "(?i)no-?code"

- id: q04
  query: "удалёнка без созвонов по утрам"
  intent: "запрос про условия труда, а не про технологию — семантика должна ловить смысл, не термин"
  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)удал[её]нн?(ая|ой|о|ый)?\\s*работ"
    - "(?i)remote"

- id: q05
  query: "возьмут студента без коммерческого опыта"
  intent: "запрос про уровень кандидата, а не про стек"
  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)студент"
    - "(?i)без опыта"
    - "(?i)junior"

- id: q06
  query: "нужно научить нейросеть отвечать голосом"
  intent: "перифраз text-to-speech/голосовых интерфейсов"
  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)voice"
    - "(?i)tts"
    - "(?i)синтез речи"
    - "(?i)голос"

- id: q07
  query: "работа с большими языковыми моделями, но не разработка самой модели, а обвязка вокруг неё"
  intent: "разграничение LLM engineering vs ML research через описание, не через термин"
  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)llm"
    - "(?i)промпт"
    - "(?i)prompt engineer"

- id: q08
  query: "проверять, не начал ли чат-бот выдумывать факты"
  intent: "перифраз задачи eval/anti-hallucination без термина «оценка качества модели»"
  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)eval"
    - "(?i)оцен.*качеств.*(модел|ответ)"
    - "(?i)hallucinat"

- id: q09
  query: "собрать конвейер, который сам вытаскивает данные из писем и кладёт в таблицу"
  intent: "перифраз ETL/парсинга почты без слова «интеграция»"
  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)etl"
    - "(?i)парсинг"
    - "(?i)email.*парс"

- id: q10
  query: "работа, где платят не за строчки кода, а за то, что бизнес-процесс стал быстрее"
  intent: "перифраз process automation consulting через результат, а не через инструмент"
  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)автоматизац.*бизнес-процесс"
    - "(?i)process automation"

- id: q11
  query: "нужен помощник для внутренней базы знаний компании, чтобы сотрудники не искали вручную"
  intent: "перифраз RAG поверх корпоративных документов без слова RAG"
  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)баз[а-я]* знаний"
    - "(?i)\\brag\\b"
    - "(?i)retrieval"

- id: q12
  query: "человек, который подключит ChatGPT к нашей CRM по протоколу, который вот только придумали"
  intent: "перифраз MCP (Model Context Protocol) без прямого термина"
  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)\\bmcp\\b"
    - "(?i)model context protocol"

- id: q13
  query: "делать так, чтобы разные ИИ-агенты не мешали друг другу и передавали задачи по цепочке"
  intent: "перифраз оркестрации агентов / agent workflow"
  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)оркестрац"
    - "(?i)orchestrat"
    - "(?i)agent.*workflow"

- id: q14
  query: "нужны скрипты, которые сами по ночам разбирают заявки, пока все спят"
  intent: "перифраз batch/cron-обработки без слов «расписание» или «python-разработчик»"
  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)python"
    - "(?i)скрипт"
    - "(?i)cron"
    - "(?i)по расписанию"

- id: q15
  query: "нужен специалист, который умеет объяснить нетехническим людям, что такое векторная база данных"
  intent: "смешанный запрос: техническая тема + коммуникативный навык"
  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)vector"
    - "(?i)векторн[а-я]* баз"

- id: q16
  query: "ищем того, кто настроит уведомления в телеграм, когда что-то сломалось на проде"
  intent: "перифраз мониторинга/алертинга через telegram-бота"
  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)telegram.*бот"
    - "(?i)мониторинг"
    - "(?i)алерт"

- id: q17
  query: "работа для тех, кто устал писать однотипный код руками и хочет, чтобы это делала машина"
  intent: "перифраз AI-ассистированной разработки / codegen без термина"
  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)генерац[а-я]* код"
    - "(?i)copilot"
    - "(?i)codegen"

- id: q18
  query: "гибкий график, можно начинать после обеда"
  intent: "запрос про условия работы, ноль ключевых слов про технологию"
  relevant_vacancy_ids: []
  relevant_patterns:
    - "(?i)гибк(ий|ое)\\s*график"
    - "(?i)свободн(ый)?\\s*график"

- id: q19
  query: "нужно, чтобы бот сам разбирался в резюме и отсеивал неподходящих кандидатов"
