[project]
name = "hh-radar"
version = "0.4.0"
description = "База вакансий hh.ru с полнотекстовым и семантическим поиском, доступная LLM-агенту через MCP"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Denis Muruev", email = "muruevden@gmail.com" }]
keywords = ["mcp", "hh.ru", "postgresql", "pgvector", "rag", "job-search"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.3.0",
    "alembic>=1.13",
    "mcp>=1.2.0",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Эмбеддинги вынесены в extra намеренно: MCP-сервер с полнотекстовым поиском
# поднимается без onnxruntime и без выкачивания модели.
rag = ["fastembed>=0.4.0"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
hh-radar = "hh_radar.cli:app"

[project.urls]
Homepage = "https://github.com/Denmurzik/hh-radar"
Repository = "https://github.com/Denmurzik/hh-radar"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hh_radar"]

# ---------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: требует поднятый PostgreSQL (docker compose up -d db)",
    "embeddings: скачивает и запускает ONNX-модель, медленно",
]
filterwarnings = ["error::DeprecationWarning:hh_radar.*"]

# ------------------------------------------------------------------ ruff ----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "RUF001", # кириллица в строках — это осознанно, проект русскоязычный
    "RUF002",
    "RUF003",
    "B008",   # typer использует вызовы в дефолтах аргументов
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"migrations/*" = ["E501", "N999", "I001"]

# ------------------------------------------------------------------ mypy ----
[tool.mypy]
# 3.12, а не 3.11: стабы numpy 2.5 используют PEP 695 (`type X = ...`),
# который mypy разбирает только начиная с 3.12. Нижняя граница проекта
# поднята до 3.12 по той же причине.
python_version = "3.12"
files = ["src/hh_radar"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fastembed.*", "pgvector.*"]
ignore_errors = true

# --------------------------------------------------------------- coverage ---
[tool.coverage.run]
source = ["src/hh_radar"]
omit = ["*/mcp_server/__main__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
