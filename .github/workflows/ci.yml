name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # В CI эмбеддинги считает детерминированная заглушка: качать 220 МБ ONNX-модель
  # на каждый пуш незачем, а проверить проводку кода она позволяет полностью.
  EMBEDDING_BACKEND: hash

jobs:
  lint:
    name: линтер и типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Установить uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Поставить зависимости
        run: uv sync --extra dev

      - name: ruff check
        run: uv run ruff check src tests migrations scripts

      - name: ruff format --check
        run: uv run ruff format --check src tests scripts

      - name: mypy
        run: uv run mypy

  test:
    name: тесты (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]

    services:
      postgres:
        # Тот же образ, что в docker-compose: тесты должны падать здесь,
        # а не на машине разработчика.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hh
          POSTGRES_PASSWORD: hh
          POSTGRES_DB: hh_radar
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hh -d hh_radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://hh:hh@localhost:5433/hh_radar

    steps:
      - uses: actions/checkout@v5

      - name: Установить uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Поставить зависимости
        run: uv sync --extra dev

      - name: Применить миграции
        # Расширение vector создаёт сама миграция: service container
        # init-скрипты из репозитория не подхватывает.
        run: uv run alembic upgrade head

      - name: Проверить, что схема совпадает с моделями
        # Ловит ситуацию «модель поменяли, миграцию забыли».
        run: uv run alembic check

      - name: Тесты
        run: uv run pytest -ra --cov=hh_radar --cov-report=term-missing

      - name: Интеграционные тесты действительно выполнялись
        # Отдельным шагом, потому что пропущенный из-за недоступной базы
        # интеграционный тест выглядит в общем прогоне как успех.
        run: uv run pytest -m integration --no-header -q

  smoke:
    name: сервер поднимается
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --extra dev

      - name: MCP-сервер импортируется и объявляет инструменты
        # Дешёвая проверка того, что ломается чаще всего: сервер должен
        # собираться без живой базы и без скачанной модели.
        run: uv run python -c "from hh_radar.mcp_server.server import build_server; print(build_server().name)"

      - name: CLI отвечает на --help
        run: uv run hh-radar --help

  quickstart:
    name: быстрый старт из README
    runs-on: ubuntu-latest
    # Отдельная работа, потому что проверяет не код, а инструкцию: человек
    # выполняет пять команд из README и должен получить работающую базу.
    # Ставится extra rag — единственное место, где проверяется, что
    # onnxruntime вообще встаёт на поддерживаемых версиях Python.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hh
          POSTGRES_PASSWORD: hh
          POSTGRES_DB: hh_radar
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hh -d hh_radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://hh:hh@localhost:5433/hh_radar

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: uv sync --extra rag
        run: uv sync --extra rag

      - name: alembic upgrade head
        run: uv run alembic upgrade head

      - name: hh-radar seed
        run: uv run hh-radar seed

      - name: hh-radar status
        run: uv run hh-radar status

      - name: Витрина собирается из данных базы
        run: |
          uv run hh-radar showcase --output /tmp/showcase
          test -s /tmp/showcase/index.html
          test -s /tmp/showcase/data.json

      - name: Семантический поиск работает на заглушке эмбеддингов
        env:
          EMBEDDING_BACKEND: hash
        run: |
          uv run hh-radar index
          uv run python -c "
          from hh_radar.db.session import session_scope
          from hh_radar.rag.search import semantic_search
          with session_scope() as s:
              hits = semantic_search(s, 'автоматизация n8n', limit=3)
          assert hits, 'семантический поиск ничего не вернул на засеянной базе'
          print('найдено:', len(hits))
          "

